<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AccessPilot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #1e293b;
      background: #f8fafc;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 16px;
      color: #0f172a;
    }
    .section {
      margin-bottom: 16px;
    }
    .section h2 {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 8px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #2563eb;
    }
    .hotkey {
      font-family: monospace;
      background: #e2e8f0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    p { margin: 0 0 8px; color: #64748b; font-size: 13px; }
    footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h1>AccessPilot</h1>
  <p>Control websites with simple commands. Accessibility-first.</p>

  <div class="section">
    <h2>Shortcuts</h2>
    <p><span class="hotkey">Ctrl+Shift+Space</span> (Mac: Cmd+Shift+Space) — Open command palette</p>
    <p><span class="hotkey">Esc</span> — Stop / close palette</p>
  </div>

  <div class="section">
    <h2>Settings</h2>
    <label>
      <input type="checkbox" id="confirm-destructive" checked>
      Confirm before destructive actions (submit, checkout)
    </label>
    <label>
      <input type="checkbox" id="access-mode">
      Remember access mode (one-hand, target boost)
    </label>
  </div>

  <footer>
    Store all settings locally. No accounts, no tracking.
  </footer>

  <script type="module" src="popup.ts"></script>
</body>
</html>
