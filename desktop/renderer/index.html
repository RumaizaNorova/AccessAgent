<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>AccessPilot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="panel">
    <h1 class="title">AccessPilot</h1>
    <p class="subtitle">Say or type what you need</p>
    <p class="mic-hint">Use Chrome. Click mic → allow when prompted → say your command (it stops when you pause).</p>

    <div class="input-row">
      <input type="text" id="command-input" placeholder="e.g. open wikipedia, search for scholarships" autocomplete="off" />
      <button type="button" id="mic-btn" class="mic-btn" aria-label="Listen for voice command" title="Click to start, click again to stop">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
        </svg>
      </button>
    </div>

    <div class="status" id="status"></div>
    <div class="log" id="log"></div>

    <p class="hint">Press <kbd>Ctrl+Shift+Space</kbd> anytime to summon</p>
  </div>

  <script src="agent.js"></script>
  <script src="voice.js"></script>
  <script src="app.js"></script>
</body>
</html>
